{# 3.7.0: the page search box; items = CSS selectors for one result each, ';' separated #}
<div class="st-search">
    <input id="st-search" type="text" autocomplete="off" spellcheck="false" placeholder="{{ placeholder }}" aria-label="{{ placeholder }}" data-search-items="{{ items }}">
    <i class="bi bi-search"></i>
    <button type="button" class="clr" title="Clear the search" aria-label="Clear the search"><i class="bi bi-x-lg"></i></button>
</div>
